[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speech-mcp-echo"
version = "0.1.0"
description = "Voice interface for multiple AI CLIs - Claude Code, Gemini, Codex and more"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Luke Chi" }
]
keywords = ["voice", "speech", "tts", "stt", "claude", "gemini", "codex", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Core dependencies - lightweight, no heavy ML frameworks
dependencies = [
    "pyaudio>=0.2.13",
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
# Local STT with faster-whisper (recommended - lightweight)
local-stt = [
    "faster-whisper>=0.10.0",
    "numba>=0.57.0",
]

# Local TTS with pyttsx3 (system voices, no heavy deps)
local-tts-light = [
    "pyttsx3>=2.90",
]

# Local TTS with Kokoro (WARNING: requires PyTorch ~2GB)
local-tts-kokoro = [
    "torch",
    "kokoro>=0.8.4",
    "pyttsx3>=2.90",
    "misaki[en]",
]

# Kokoro with Chinese support
local-tts-kokoro-zh = [
    "speech-mcp-echo[local-tts-kokoro]",
    "misaki[zh]",
]

# Kokoro with Japanese support
local-tts-kokoro-ja = [
    "speech-mcp-echo[local-tts-kokoro]",
    "misaki[ja]",
]

# Cloud services (OpenAI API)
cloud-openai = [
    "openai>=1.0.0",
]

# Cloud services (Google Cloud) - optional, gcloud CLI works without these
cloud-google = [
    "google-cloud-speech>=2.21.0",
    "google-cloud-texttospeech>=2.14.0",
]

# MCP support
mcp = [
    "mcp[cli]>=1.2.0",
    "pydantic>=2.7.2,<3.0.0",
]

# Development
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

# Recommended: Everything except heavy Kokoro/PyTorch
recommended = [
    "speech-mcp-echo[local-stt,local-tts-light,mcp]",
]

# All optional dependencies (WARNING: includes PyTorch ~2GB)
all = [
    "speech-mcp-echo[local-stt,local-tts-kokoro,cloud-openai,cloud-google,mcp,dev]",
]

[project.scripts]
speech-mcp-echo = "speech_mcp_echo:main"

[project.urls]
Homepage = "https://github.com/lukechi1219/speech-mcp-echo"
Repository = "https://github.com/lukechi1219/speech-mcp-echo.git"

[tool.hatch.build]
include = [
    "src/**/*.py",
    "src/**/resources/**/*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/speech_mcp_echo"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (require API keys, network access)",
]
